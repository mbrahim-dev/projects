<!-- component: metric_value -->
<h3 class="metric-value">{value}</h3>

<!-- component: metric_delta -->
<span class="metric-delta" style="color:{color}">{delta}</span> <span class="metric-delta-label">{label}</span>

<!-- component: metric_delta_empty -->
<span class="metric-delta-empty">&nbsp;</span>

<!-- component: progress_bar -->
<div class="metric-progress-track"><div class="metric-progress-fill" style="width:{progress}%; background-color:{color};"></div></div>

<!-- component: geo_legend -->
<div class="geo-legend">
  <div class="geo-legend-item"><span class="geo-legend-dot geo-revenue"></span><span>Revenue</span></div>
  <div class="geo-legend-item"><span class="geo-legend-dot geo-profit"></span><span>Profit</span></div>
  <div class="geo-legend-item"><span class="geo-legend-dot geo-orders"></span><span>Number of Orders</span></div>
  <div class="geo-legend-item"><span class="geo-legend-dot geo-units"></span><span>Units Sold</span></div>
</div>
